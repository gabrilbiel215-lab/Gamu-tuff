<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jogo do Tuffão — Embaixadinhas 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    background:linear-gradient(#3d9bff 0%,#9fdcff 55%,#7fd36b 100%);font-family:'Lilita One',system-ui,sans-serif;color:#fff}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .outline{text-shadow:0 3px 0 #0a2a4a,3px 0 0 #0a2a4a,-3px 0 0 #0a2a4a,0 -3px 0 #0a2a4a,3px 3px 0 #0a2a4a,-3px -3px 0 #0a2a4a,3px -3px 0 #0a2a4a,-3px 3px 0 #0a2a4a}
  #hud{position:fixed;inset:0;pointer-events:none}
  #score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center}
  #score .n{font-size:clamp(56px,13vw,96px);line-height:1;display:block}
  #score .l{font-size:clamp(12px,3vw,16px);letter-spacing:.18em;opacity:.95}
  #combo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 118px);left:0;right:0;text-align:center;font-size:clamp(18px,4.5vw,26px);color:#ffe14a;min-height:1.2em}
  #fb{position:absolute;left:50%;top:48%;font-size:clamp(34px,9vw,60px);opacity:0;white-space:nowrap;transform:translate(-50%,0)}
  #fb.pop{animation:pop .7s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}18%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
  #score .n.bump{animation:bump .18s ease-out}
  @keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  #overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center}
  #card{background:rgba(10,42,74,.78);border:3px solid #fff;border-radius:22px;padding:18px 22px;max-width:440px;backdrop-filter:blur(4px)}
  #card h1{margin:0;font-size:clamp(38px,10vw,58px);color:#ffcf2e;line-height:1}
  #card .sub{margin:4px 0 10px;font-size:clamp(14px,3.8vw,18px);opacity:.95}
  #card p{margin:6px 0;font-family:system-ui,sans-serif;font-weight:600;font-size:clamp(13px,3.5vw,15px);line-height:1.35}
  #card .cta{margin-top:12px;font-family:'Lilita One',system-ui,sans-serif;font-size:clamp(18px,5vw,24px);color:#7dffa0;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.45}}
  .g{color:#7dffa0}.y{color:#ffd400}
  #hud.menu #score,#hud.menu #combo{display:none}
  #overlay{align-items:flex-start!important;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0!important}
  #card{pointer-events:auto;width:100%;max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px!important}
  #card h1{font-size:clamp(32px,8vw,48px)!important}
  .skins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
  .sk{font-family:'Lilita One',system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:12px;padding:5px 4px;width:30%;min-width:92px;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font-size:13px;line-height:1.15}
  .sk .e{font-size:24px}.sk .r{font-size:12px;opacity:.9}
  .sk.sel{border-color:#7dffa0;background:rgba(125,255,160,.25)}
  .sk.locked{opacity:.55;border-style:dashed}
  .sk.new{border-color:#ffd400;animation:blink 1s infinite}
  .hint{min-height:1.3em;font-family:system-ui,sans-serif;font-weight:700;font-size:13px;color:#ffd400;margin:2px 0 6px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:'Lilita One',system-ui,sans-serif;font-size:clamp(18px,5vw,22px);color:#0a2a4a;background:#7dffa0;border:0;border-radius:14px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 #2a9a55}
  .btn.alt{background:#ffd400;box-shadow:0 4px 0 #b89500}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a9a55}
  .nm{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0;font-family:system-ui,sans-serif;font-weight:700;font-size:13px}
  .nm input{font:600 15px system-ui,sans-serif;width:150px;padding:6px 10px;border-radius:10px;border:2px solid #fff;background:rgba(255,255,255,.95);color:#0a2a4a;text-align:center}
  .rk{width:100%;border-collapse:collapse;margin:6px 0;font-family:system-ui,sans-serif;font-weight:700;font-size:15px}
  .rk td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.2);text-align:left}
  .rk td:last-child{text-align:right;color:#ffd400;font-size:17px}
  .rk tr.me{background:rgba(255,212,0,.25)}
  .tip{font-family:system-ui,sans-serif;font-weight:600;font-size:12px;opacity:.8;margin-top:6px}
  #toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 150px);left:50%;transform:translateX(-50%);background:rgba(10,42,74,.85);border:3px solid #ffd400;border-radius:16px;padding:8px 16px;font-size:clamp(16px,4.5vw,22px);color:#ffd400;white-space:nowrap;opacity:0;transition:opacity .3s}
  #toast.on{opacity:1}
  .acct{font-family:system-ui,sans-serif;font-weight:700;font-size:13px;margin:2px 0 4px;opacity:.95}
  .lnk{background:none;border:0;color:#7dd3ff;text-decoration:underline;font:inherit;cursor:pointer;padding:0 2px}
  .tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}
  .tab{font-family:'Lilita One',system-ui,sans-serif;font-size:17px;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:12px;padding:6px 16px;cursor:pointer}
  .tab.sel{background:#ffd400;color:#0a2a4a;border-color:#ffd400}
  .err{color:#ff8a8a;font-family:system-ui,sans-serif;font-weight:700;font-size:13px;min-height:1.2em;margin:4px 0}
  #startBtn{display:none;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);pointer-events:auto;font-family:'Lilita One',system-ui,sans-serif;font-size:clamp(26px,7vw,36px);color:#0a2a4a;background:#7dffa0;border:4px solid #fff;border-radius:22px;padding:12px 34px;box-shadow:0 6px 0 #2a9a55,0 10px 24px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap}
  #startBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #2a9a55}
  .nm .btn{white-space:nowrap}
  #msg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:20px;padding:20px}
</style>
</head>
<body>
<div id="hud" class="menu">
  <div id="score" class="outline"><span class="n" id="n">0</span><span class="l">PONTOS</span></div>
  <div id="combo" class="outline"></div>
  <div id="fb" class="outline"></div>
  <div id="toast"></div>
  <button id="startBtn">▶ COMEÇAR</button>
  <div id="overlay"><div id="card"></div></div>
</div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('msg').textContent='Não consegui carregar o 3D. Verifique sua conexão e recarregue.';return;}

/* ---------- Cena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,1,0.1,200);
const hemi=new THREE.HemisphereLight(0xffffff,0x3a7a3a,0.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2cc,0.85);sun.position.set(5,10,7);scene.add(sun);

const mat=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r===undefined?0.7:r});
function sph(r,color,sx,sy,sz,x,y,z,parent,rough){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),typeof color==='number'?mat(color,rough):color);
  m.scale.set(sx,sy,sz);m.position.set(x,y,z);parent.add(m);return m;
}

/* campo */
const gCanvas=document.createElement('canvas');gCanvas.width=64;gCanvas.height=128;
const gTex=new THREE.CanvasTexture(gCanvas);gTex.wrapS=gTex.wrapT=THREE.RepeatWrapping;gTex.repeat.set(1,10);
function paintGround(c1,c2){const x=gCanvas.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,64,64);x.fillStyle=c2;x.fillRect(0,64,64,64);gTex.needsUpdate=true;}
paintGround('#3fae45','#4cc152');
const groundMesh=new THREE.Mesh(new THREE.PlaneGeometry(70,60),new THREE.MeshStandardMaterial({map:gTex,roughness:1}));
groundMesh.rotation.x=-Math.PI/2;groundMesh.position.z=-10;scene.add(groundMesh);
const lineMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7});
const lineRing=new THREE.Mesh(new THREE.RingGeometry(2.6,2.72,64),lineMat);
lineRing.rotation.x=-Math.PI/2;lineRing.position.set(0,0.01,0.4);scene.add(lineRing);

/* arquibancada, sol, nuvens, estrelas */
const crowd=[],cloudsG=new THREE.Group(),starsG=new THREE.Group();let wallMesh,sunMesh;
scene.add(cloudsG);scene.add(starsG);
(function(){
  wallMesh=new THREE.Mesh(new THREE.BoxGeometry(80,6,1.5),mat(0x26364a));wallMesh.position.set(0,2,-18);scene.add(wallMesh);
  const cols=[0xffdf00,0x009c3b,0x002776,0xffffff,0xffdf00,0x009c3b];
  const skin=[0xf1c27d,0xc68642,0x8d5524,0xffdbac];
  for(let r=0;r<2;r++)for(let j=0;j<46;j++){
    const gp=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.8,0.5),mat(cols[(j*7+r*3)%cols.length]));gp.add(b);
    const h=new THREE.Mesh(new THREE.SphereGeometry(0.24,10,8),mat(skin[(j+r)%skin.length]));h.position.y=0.62;gp.add(h);
    gp.position.set(-30+j*1.3+(r*0.6),0.9+r*1.0,-16.4-r*0.8);
    gp.userData={base:gp.position.y,ph:Math.random()*6};
    scene.add(gp);crowd.push(gp);
  }
  sunMesh=new THREE.Mesh(new THREE.SphereGeometry(2.2,24,16),new THREE.MeshBasicMaterial({color:0xfff3a0}));sunMesh.position.set(-16,14,-32);scene.add(sunMesh);
  for(let i=0;i<5;i++){
    const cg=new THREE.Group();
    for(let k=0;k<4;k++){const sp=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*.8,12,10),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9}));sp.position.set(k*1.5,Math.random()*.5,0);sp.scale.y=.6;cg.add(sp);}
    cg.position.set(-26+i*13,10+Math.random()*4,-30);cloudsG.add(cg);
  }
  const sm=new THREE.MeshBasicMaterial({color:0xffffff});
  for(let i=0;i<90;i++){const st=new THREE.Mesh(new THREE.SphereGeometry(0.07+Math.random()*0.06,5,4),sm);st.position.set(-40+Math.random()*80,4+Math.random()*26,-40+Math.random()*16);starsG.add(st);}
})();

/* ---------- Tuffão ---------- */
const mBody=mat(0xe8481c),mHead=mat(0xe8481c),mBelly=mat(0xffc27a),mWing=mat(0xb82e0f),mLeg=mat(0xffc928),mBoot=mat(0x1c1c1c),
  mComb=mat(0xe21b2c),mBand=mat(0x1faa4b),mBeak=mat(0xffc928),mShorts=mat(0x222222),mMohawk=mat(0xff2d95),
  mTail=[mat(0x1b9e5a),mat(0x2a6fd6),mat(0xf2a516)];
function mkStripes(c1,c2){
  const c=document.createElement('canvas');c.width=256;c.height=8;const x=c.getContext('2d');
  for(let i=0;i<16;i++){x.fillStyle=i%2?c1:c2;x.fillRect(i*16,0,16,8);}
  return new THREE.CanvasTexture(c);
}
const stripeTex=mkStripes('#ffffff','#1f5fbf'),stripeTex2=mkStripes('#f2f2f2','#1a1a1a'),stripeTex3=mkStripes('#ff4fa3','#17d9c8');
const acc=[],combMeshes=[];
function reg(tags,o){acc.push({tags:tags,o:o});return o;}
function asph(tags,r,color,sx,sy,sz,x,y,z,parent){return reg(tags,sph(r,color,sx,sy,sz,x,y,z,parent));}
function glow(tags,r,color,op,parent){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));parent.add(m);reg(tags,m);return m;}
function abox(tags,w,h,d,color,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);parent.add(m);return reg(tags,m);}

const rooster=new THREE.Group();scene.add(rooster);
const bodyG=new THREE.Group();bodyG.position.y=1.45;rooster.add(bodyG);
sph(0.85,mBody,0.9,0.95,1.05,0,0,0,bodyG);
sph(0.6,mBelly,0.85,0.95,0.8,0,-0.12,0.42,bodyG);
const headG=new THREE.Group();headG.position.set(0,0.95,0.55);bodyG.add(headG);
sph(0.4,mHead,1,1,1,0,0,0,headG);
const beak=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.42,14),mBeak);beak.rotation.x=Math.PI/2;beak.position.set(0,-0.05,0.48);headG.add(beak);
[-1,1].forEach(s=>{
  sph(0.11,0xffffff,1,1,1,s*0.2,0.1,0.3,headG,0.3);
  sph(0.06,0x111111,1,1,1,s*0.22,0.1,0.39,headG,0.3);
});
combMeshes.push(sph(0.13,mComb,0.5,1,1,0,0.42,0.12,headG),sph(0.16,mComb,0.5,1,1,0,0.48,0,headG),sph(0.12,mComb,0.5,1,1,0,0.4,-0.13,headG));
sph(0.1,mComb,0.6,1.4,0.6,0,-0.3,0.3,headG);
const band=new THREE.Mesh(new THREE.TorusGeometry(0.39,0.05,8,32),mBand);band.rotation.x=Math.PI/2;band.position.y=0.17;headG.add(band);
const wings=[];
[-1,1].forEach(s=>{
  const w=new THREE.Group();w.position.set(s*0.74,0.05,-0.05);bodyG.add(w);
  sph(0.5,mWing,0.2,0.75,0.85,0,-0.1,0,w);wings.push({g:w,s:s});
});
const tailG=new THREE.Group();tailG.position.set(0,0.2,-0.8);bodyG.add(tailG);
for(let i=0;i<7;i++){
  const p=new THREE.Group();p.rotation.set(-0.5,0,(i-3)*0.32);tailG.add(p);
  const len=i===3?1:0.85-Math.abs(i-3)*0.05;
  sph(1,mTail[i%3],0.17,len*0.9,0.3,0,len*0.85,0,p);
}
const legs=[];
[-1,1].forEach(s=>{
  const lg=new THREE.Group();lg.position.set(s*0.33,0.85,0.12);rooster.add(lg);
  const th=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.06,0.74,10),mLeg);th.position.y=-0.37;lg.add(th);
  const bt=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.14,0.48),mBoot);bt.position.set(0,-0.78,0.1);lg.add(bt);
  legs.push(lg);
});

/* acessórios das skins */
// shorts / calça
asph(['rock','ney','ron','cow','ninja','pirate','emo','sad','miami','bolt','tom','gau','clt','bandit','cop','fire','gang','astro','sigma','hero','ther','fur'],0.66,mShorts,0.95,0.45,1.05,0,-0.55,0,bodyG);
// moicano (roqueiro e Neymar)
for(let i=0;i<5;i++){
  const c=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.38,6),mMohawk);
  c.position.set(0,0.45,0.22-i*0.12);c.rotation.x=-0.25-i*0.08;headG.add(c);reg(['rock','ney'],c);
}
// roqueiro: óculos, correia e guitarra
abox(['rock','aura','miami','gang'],0.2,0.13,0.06,0x0b0b0b,-0.2,0.1,0.44,headG);
abox(['rock','aura','miami','gang'],0.2,0.13,0.06,0x0b0b0b,0.2,0.1,0.44,headG);
abox(['rock','aura','miami','gang'],0.14,0.03,0.04,0x0b0b0b,0,0.12,0.45,headG);
(function(){
  const st=abox(['rock'],0.1,1.5,0.04,0x5a1010,0,0.05,0.9,bodyG);st.rotation.z=-0.6;
  const gt=new THREE.Group();gt.position.set(-1.1,-0.2,0.1);gt.rotation.z=0.35;bodyG.add(gt);reg(['rock'],gt);
  sph(0.36,0xd01010,0.25,1,0.9,0,-0.15,0,gt);sph(0.26,0xd01010,0.25,1,0.9,0,0.25,0,gt);
  const nk=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.9,0.1),mat(0x3b2412));nk.position.y=0.85;gt.add(nk);
  const hs=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.22,0.13),mat(0x111111));hs.position.y=1.4;gt.add(hs);
})();
// Neymar: brinco de diamante
asph(['ney'],0.05,0xffffff,1,1,1,0.4,-0.05,0.05,headG);
asph(['ney'],0.05,0xffd700,1,1,1,-0.4,-0.05,0.05,headG);
// Ronaldinho: cabelão e dentuço
[[-0.32,0,-0.05,0.26],[0.32,0,-0.05,0.26],[0,0.22,-0.22,0.3],[-0.3,-0.3,-0.15,0.22],[0.3,-0.3,-0.15,0.22],[0,-0.1,-0.38,0.28],[0,0.3,0.0,0.22]].forEach(function(h){
  asph(['ron'],h[3],0x2a1608,1,1,1,h[0],h[1],h[2],headG);
});
// Femboy: saia, laço e bochechas
(function(){
  const sk=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.9,0.4,28,1,true),new THREE.MeshStandardMaterial({color:0xf06292,roughness:.8,side:THREE.DoubleSide}));
  sk.scale.z=1.15;sk.position.set(0,-0.62,0.02);bodyG.add(sk);reg(['fem','tufona'],sk);
})();
asph(['fem'],0.15,0xff2d78,1.4,0.8,0.5,-0.18,0.46,0.1,headG);
asph(['fem'],0.15,0xff2d78,1.4,0.8,0.5,0.18,0.46,0.1,headG);
asph(['fem'],0.07,0xd81b60,1,1,1,0,0.46,0.1,headG);
asph(['fem'],0.07,0xff4d8d,1,1,0.4,-0.3,-0.08,0.28,headG);
asph(['fem'],0.07,0xff4d8d,1,1,0.4,0.3,-0.08,0.28,headG);
// Cowboy: chapéu, lenço e estrela
(function(){
  const hm=mat(0x7a4a22);
  const cr=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.32,18),hm);cr.position.set(0,0.52,0);headG.add(cr);reg(['cow'],cr);
  const br=new THREE.Mesh(new THREE.CylinderGeometry(0.64,0.64,0.04,28),hm);br.position.set(0,0.34,0.02);headG.add(br);reg(['cow'],br);
  const bn=new THREE.Mesh(new THREE.TorusGeometry(0.29,0.035,8,22),mat(0x2b1608));bn.rotation.x=Math.PI/2;bn.position.set(0,0.4,0);headG.add(bn);reg(['cow'],bn);
})();
asph(['cow'],0.3,0xd32f2f,1.2,0.5,0.8,0,0.6,0.52,bodyG);
asph(['cow'],0.12,0xffd700,1,1,0.3,0.3,0.05,0.88,bodyG);

// Cozinheiro: touca, avental e bigode
(function(){
  const w=mat(0xffffff);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.2,20),w);base.position.set(0,0.45,0);headG.add(base);reg(['chef'],base);
})();
asph(['chef'],0.32,0xffffff,1.1,0.8,1.1,0,0.68,0,headG);
asph(['chef'],0.5,0x2c3e6b,0.85,0.95,0.22,0,-0.15,0.87,bodyG);
asph(['chef'],0.07,0x222222,1.4,0.6,0.7,-0.1,-0.13,0.42,headG);
asph(['chef'],0.07,0x222222,1.4,0.6,0.7,0.1,-0.13,0.42,headG);
// Ninja: máscara, testeira lisa e lenço
asph(['ninja'],0.42,0x1f2a44,1,0.5,1,0,-0.22,-0.02,headG);

/* ---------- Senha (PBKDF2) ---------- */
function b64(buf){let s='';new Uint8Array(buf).forEach(function(b){s+=String.fromCharCode(b);});return btoa(s);}

async function loadRank(){

        const x=d.data()||{};
        Object.keys(x.accounts||{}).forEach(function(sl){const a=x.accounts[sl]||{};all.push({n:String(a.name||'?').slice(0,14),s:+a.best||0,k:a.skin,me:loggedIn&&d.id===uid&&sl===acctSlug});});

/* ---------- Conta ---------- */
function saveAcct(patch){
  if(!acct||!dbR||!acctSlug)return;
  Object.assign(acct,patch);
  if(docData&&docData.accounts&&docData.accounts[acctSlug])Object.assign(docData.accounts[acctSlug],patch);
  const ref=dbR.doc('scores/'+uid),body={accounts:{}};body.accounts[acctSlug]=Object.assign({},patch);
  writeChain=writeChain.then(function(){return ref.update(body);}).catch(function(){});
}
function applySel(){
  ['skin','ball','bg'].forEach(function(c){
    const C=CATS[c];let id=sel[c];
    if(loggedIn&&acct&&acct[C.field])id=acct[C.field];
    const it=byId(C.list,id);C.apply(isUnlocked(it)?it.id:C.list[0].id);
  });
}
function afterLogin(remember){
  loggedIn=true;
  if(remember){try{localStorage.setItem('tuffao_login',uid+'|'+acctSlug);}catch(e){}}
  applySel();
}
async function loadPw(sl){
  if(pwCache[sl]!==undefined)return;
  try{const r=await withTimeout(dbR.doc(pwPath(sl)).get(),10000);pwCache[sl]=r.exists?r.data():null;}catch(e){pwCache[sl]=null;}
}
function selectAcc(sl){
  authSel=sl;authTab='in';authErr='';render('auth');
  if(pwCache[sl]===undefined)loadPw(sl).then(function(){if(view==='auth'&&authSel===sl)render('auth');});
}
function enter(sl,remember){
  acct=Object.assign({},myAccts()[sl]);acctSlug=sl;afterLogin(remember);toast('Bem-vindo, '+acct.name+'!');render('menu');
}
async function doLogin(){
  if(busy)return;busy=true;authErr='';
  try{
    const pw0=pwCache[authSel];
    if(canPw&&pw0){
      const pw=val('pw');
      if(!pw){authErr='Digite sua senha.';busy=false;render('auth');return;}
      const h=await hashPw(pw,pw0.salt,pw0.iters);
      if(h!==pw0.hash){authErr='Senha incorreta.';busy=false;render('auth');return;}
    }
    const rem=document.getElementById('rem');
    enter(authSel,rem?rem.checked:true);
  }catch(e){authErr='Não deu pra entrar agora. Tente de novo.';render('auth');}
  busy=false;
}
async function doSetPass(){
  if(busy)return;
  const pw=val('pw'),pw2=val('pw2'),er=pwErr(pw,pw2);
  if(er){authErr=er;render('auth');return;}
  busy=true;authErr='';
  try{
    const d=await makePass(pw);await dbR.doc(pwPath(authSel)).set(d);
    pwCache[authSel]=d;enter(authSel,true);
  }catch(e){authErr='Não consegui salvar a senha agora.';render('auth');}
  busy=false;
}
async function createAccount(){
  if(busy)return;
  const nick=val('nick').trim();
  if(nick.length<3||nick.length>14||!/^[\p{L}\p{N} _.\-]+$/u.test(nick)){authErr='Apelido: de 3 a 14 letras, números, espaço, _ . ou -';render('auth');return;}
  const slug=slugOf(nick)||('u'+Date.now().toString(36));
  if(myAccts()[slug]){authErr='Você já tem uma conta com esse apelido.';render('auth');return;}
  let pwd=null;
  if(canPw){const pw=val('pw'),er=pwErr(pw,val('pw2'));if(er){authErr=er;render('auth');return;}pwd=pw;}
  busy=true;authErr='';
  try{
    try{
      const snap=await withTimeout(dbR.collection('scores').limit(300).get(),8000);
      let taken=false;snap.docs.forEach(function(d){if(d.id!==uid&&d.data()&&d.data().accounts&&d.data().accounts[slug])taken=true;});
      if(taken){authErr='Esse apelido já está em uso. Escolha outro.';busy=false;render('auth');return;}
    }catch(e){}
    const data={name:nick,best:localBest,skin:'classic',ball:'b0',bg:'g0',codes:codesLocal.slice(),created:Date.now(),updated:Date.now()};
    const body={accounts:{}};body.accounts[slug]=data;
    const ref=dbR.doc('scores/'+uid);
    if(docExists)await ref.update(body);else await ref.set(body);
    docExists=true;docData=docData||{accounts:{}};docData.accounts=docData.accounts||{};docData.accounts[slug]=data;
    if(pwd!==null){const d=await makePass(pwd);await dbR.doc(pwPath(slug)).set(d);pwCache[slug]=d;}
    else pwCache[slug]=null;
    enter(slug,true);toast('Conta criada! 🐓');
  }catch(e){
    authErr=(e&&e.code==='invalid_argument')?'Sem permissão para criar conta. Peça acesso de colaborador ao dono do jogo.':'Não deu pra criar a conta agora. Tente de novo.';
    render('auth');
  }
  busy=false;
}
function logout(){
  loggedIn=false;acct=null;acctSlug=null;authSel=null;authTab='in';authErr='';guestChosen=false;
  try{localStorage.removeItem('tuffao_login');}catch(x){}
  applySel();
  if(cloud==='ready'){render('auth');if(Object.keys(myAccts()).length){selectAcc(Object.keys(myAccts())[0]);}}else render('menu');
}
const CODES={cinico:'shiny',mobilete:'moto'};
function redeem(){
  const k=val('code').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  if(!k){render(view,'Digite um código.');return;}
  const id=CODES[k];
  if(!id){render(view,'❌ Código inválido.');return;}
  const it=byId(SKINS,id);
  if(redeemed(k)){render(view,'Você já usou esse código.');return;}
  codesLocal.push(k);try{localStorage.setItem('tuffao_codes',JSON.stringify(codesLocal));}catch(e){}
  if(loggedIn&&acct){const u=(acct.codes||[]).concat(codesLocal.filter(function(c){return (acct.codes||[]).indexOf(c)<0;}));saveAcct({codes:u});}
  tab='skin';applySkin(id);sel.skin=id;
  try{localStorage.setItem('tuffao_skin',id);}catch(e){}
  if(loggedIn)saveAcct({skin:id});
  toast('🔓 Código aceito: '+it.name+'!');sndCrow();render(view);
}
function pick(cat,id){
  const C=CATS[cat],it=byId(C.list,id);
  if(!isUnlocked(it)){render(view,'🔒 '+esc(it.name)+': '+(it.code?'use o código secreto para liberar!':'faça '+it.need+' pontos para liberar!'));return;}
  C.apply(id);sel[cat]=id;
  try{localStorage.setItem(C.key,id);}catch(e){}
  if(loggedIn){const p={};p[C.field]=id;saveAcct(p);}
  render(view);
}
function onCardClick(e){
  const b=e.target.closest('[data-act],[data-pick],[data-tab],[data-acc]');if(!b)return;
  ensureAudio();
  if(b.dataset.acc){selectAcc(b.dataset.acc);return;}
  if(b.dataset.tab){tab=b.dataset.tab;render(view);return;}
  if(b.dataset.pick){const p=b.dataset.pick.split(':');pick(p[0],p[1]);return;}
  switch(b.dataset.act){
    case 'play':if(state==='over'&&performance.now()-overAt<400)return;start();break;
    case 'rank':render('rank');break;
    case 'back':render(lastMain);break;
    case 'tab-in':authTab='in';authErr='';render('auth');break;
    case 'tab-new':authTab='new';authErr='';render('auth');break;
    case 'forgot':authTab='forgot';authErr='';render('auth');break;
    case 'login':doLogin();break;
    case 'setpass':doSetPass();break;
    case 'create':createAccount();break;
    case 'guest':guestChosen=true;render('menu');break;
    case 'goauth':authErr='';authTab=Object.keys(myAccts()).length?'in':'new';render('auth');if(authTab==='in')selectAcc(authSel&&myAccts()[authSel]?authSel:Object.keys(myAccts())[0]);break;
    case 'logout':logout();break;
    case 'redeem':redeem();break;
  }
}
card.addEventListener('pointerdown',function(e){e.stopPropagation();});
card.addEventListener('click',onCardClick);
startBtn.addEventListener('pointerdown',function(e){e.stopPropagation();});
startBtn.addEventListener('click',function(){ensureAudio();if(state==='over'&&performance.now()-overAt<400)return;if(state==='menu'||state==='over')start();});
function submitAuth(){
  if(authTab==='new')createAccount();
  else if(authTab==='forgot'||(canPw&&authSel&&pwCache[authSel]===null))doSetPass();
  else doLogin();
}
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use)){cloud='none';return;}
    const r=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!r[0]||!r[1]){cloud='none';return;}
    const id=await r[0].id();
    if(!id){cloud='none';return;}
    dbR=r[1];uid=id;
    const snap=await withTimeout(dbR.doc('scores/'+uid).get(),10000);
    docExists=snap.exists;docData=snap.exists?snap.data():null;
    // migração da conta única antiga para o formato de várias contas
    if(docData&&docData.name&&!docData.accounts){
      try{
        const sl=slugOf(docData.name)||('u'+Date.now().toString(36));
        const old=docData,acc={name:old.name,best:old.best||0,skin:old.skin||'classic',ball:old.ball||'b0',bg:old.bg||'g0',created:old.created||Date.now(),updated:Date.now()};
        const nd={accounts:{}};nd.accounts[sl]=acc;
        await dbR.doc('scores/'+uid).set(nd);docData=nd;
        const op=await dbR.doc('data/users/'+uid+'/auth').get();
        if(op.exists){await dbR.doc(pwPath(sl)).set(op.data());}
      }catch(e){}
    }
    cloud='ready';
    const slugs=Object.keys(myAccts());
    authTab=slugs.length?'in':'new';
    if(slugs.length)await loadPw(slugs[0]);
    let flag=null;try{flag=localStorage.getItem('tuffao_login');}catch(e){}
    if(flag){const pp=flag.split('|');if(pp[0]===uid&&myAccts()[pp[1]]){await loadPw(pp[1]);if(pwCache[pp[1]]||!canPw){authSel=pp[1];acct=Object.assign({},myAccts()[pp[1]]);acctSlug=pp[1];afterLogin(true);}}}
  }catch(e){cloud=cloud==='ready'?'ready':'none';}
  if(state==='menu'&&(view==='menu'||view==='auth')){
    render(cloud==='ready'&&!loggedIn&&!guestChosen?'auth':'menu');
  }
}

/* ---------- Áudio ---------- */
let ac=null;
function ensureAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();}if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(f1,f2,d,type,v,delay){
  if(!ac)return;try{
  const o=ac.createOscillator(),gn=ac.createGain(),t0=ac.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
  gn.gain.setValueAtTime(v||.15,t0);gn.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(gn);gn.connect(ac.destination);o.start(t0);o.stop(t0+d+0.03);}catch(e){}
}
function sndKick(perfect){tone(200,60,.13,'sine',.4);tone(700,1000,.08,'square',.05);if(perfect){tone(880,1400,.16,'triangle',.2,.04);tone(1320,1760,.14,'triangle',.15,.12);}}
function sndBad(){tone(160,90,.25,'sawtooth',.12);}
function sndOver(){tone(420,90,.6,'sawtooth',.14);tone(300,60,.7,'square',.06,.1);}
function sndCrow(){const s=[[500,900],[700,1100],[600,1000],[900,1300],[1000,700]];s.forEach(function(p,i){tone(p[0],p[1],.13,'sawtooth',.09,i*.14);});}

/* ---------- Jogo ---------- */
function feedback(txt,color){fbEl.textContent=txt;fbEl.style.color=color;fbEl.classList.remove('pop');void fbEl.offsetWidth;fbEl.classList.add('pop');}
function setScore(){nEl.textContent=pts;nEl.classList.remove('bump');void nEl.offsetWidth;nEl.classList.add('bump');comboEl.textContent=combo>=2?('PERFEITOS x'+combo+' 🔥'):'';}
function start(){
  state='play';hits=0;pts=0;combo=0;g=9;cooldown=0;stumble=0;newly=[];bestAtStart=curBest();
  ball.x=0;ball.y=4.2;ball.vx=0;ball.vy=0;
  nEl.textContent='0';comboEl.textContent='';setOverlay(false);
}
function gameOver(){
  state='over';overAt=performance.now();shake=0.5;
  const prev=curBest();
  newly=allItems().filter(function(i){return i.need>prev&&i.need<=pts;}).map(function(i){return i.cat+':'+i.id;});
  if(pts>prev){
    if(loggedIn&&acct)saveAcct({best:pts,skin:curSkin,updated:Date.now()});
    else{localBest=pts;try{localStorage.setItem('tuffao_best',String(pts));}catch(e){}}
  }
  if(!loggedIn&&pts>0){
    lastLocalId=Date.now();localRank.push({n:'Convidado',s:pts,k:curSkin,id:lastLocalId});
    localRank.sort(function(a,b){return b.s-a.s||a.id-b.id;});localRank=localRank.slice(0,10);
    try{localStorage.setItem('tuffao_rank',JSON.stringify(localRank));}catch(e){}
  }
  sndOver();feedback('CAIU!','#ff6b6b');combo=0;comboEl.textContent='';
  setTimeout(function(){if(state==='over')render('over');},450);
}
function kick(){
  if(cooldown>0)return;
  const dy=ball.y-RING_Y;
  if(ball.vy<=0&&dy>=-0.6&&dy<=1.1){
    const perfect=dy>=-0.25&&dy<=0.35;
    hits++;combo=perfect?combo+1:0;const before=pts;pts+=perfect?2:1;
    ball.vy=Math.sqrt(2*g*(perfect?2.7:2.3));
    ball.vx=clamp(-ball.x*1.1+(Math.random()-.5)*1.6,-1.8,1.8);
    g=Math.min(17,g+0.16);
    kickT=1;activeLeg=1-activeLeg;
    sndKick(perfect);
    feedback(perfect?'PERFEITO! +2':'BOM! +1',perfect?'#ffd400':'#7dffa0');
    burst(perfect?16:5,ball.x,ball.y,BZ);
    setScore();
    let unlocked=null;
    allItems().forEach(function(i){if(i.need>0&&before<i.need&&pts>=i.need&&bestAtStart<i.need)unlocked=i;});
    if(unlocked){toast('🔓 Desbloqueou: '+unlocked.name+'!');sndCrow();}
    else if(hits%10===0){sndCrow();setTimeout(function(){feedback('KIKIRIKIII! 🐓','#ffb347');},250);}
  }else{
    cooldown=0.45;combo=0;stumble=1;comboEl.textContent='';
    sndBad();feedback(dy>1.1||ball.vy>0?'CEDO!':'TARDE!','#ff6b6b');
  }
}
function press(){
  ensureAudio();
  if(state==='play')kick();
}
window.addEventListener('pointerdown',function(e){e.preventDefault();press();},{passive:false});
window.addEventListener('keydown',function(e){
  const tg=e.target&&e.target.tagName;
  if(tg==='INPUT'){if(e.key==='Enter'){e.preventDefault();if(e.target.id==='code')redeem();else submitAuth();}return;}
  if(e.code==='Space'||e.key===' '){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(!e.repeat)press();}
});
window.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- Loop ---------- */
function resize(){
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  renderer.setSize(w,h,false);camera.aspect=a;
  camZ=a<1.1?9.5+(1.1-a)*10:9.5;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

function update(dt){
  t+=dt;cooldown=Math.max(0,cooldown-dt);kickT=Math.max(0,kickT-dt*4.5);stumble=Math.max(0,stumble-dt*2.2);shake=Math.max(0,shake-dt);

  if(state==='menu'){
    ball.x=Math.sin(t*0.8)*0.5;ball.y=3+Math.sin(t*2.2)*0.5;ball.vy=0;ball.vx=0;
  }else{
    ball.vy-=g*dt;ball.y+=ball.vy*dt;ball.x+=ball.vx*dt;
    if(state==='play'&&ball.y<=BR&&ball.vy<0){ball.y=BR;gameOver();}
    if(state==='over'&&ball.y<BR){ball.y=BR;ball.vy=-ball.vy*0.45;ball.vx*=0.7;if(Math.abs(ball.vy)<0.8)ball.vy=0;}
  }

  rooster.position.x+=(ball.x-rooster.position.x)*Math.min(1,dt*7);
  const play=state==='play';
  rooster.position.y=play?Math.abs(Math.sin(t*7))*0.05:0;
  const prox=(play&&ball.vy<0)?clamp(1-(ball.y-RING_Y)/3,0,1):0;
  legs.forEach(function(lg,i){
    let a=0;
    if(state==='over')a=0;
    else if(i===activeLeg)a=-1.4*kickT;
    else a=-0.35*prox*(1-kickT);
    lg.rotation.x+=(a-lg.rotation.x)*Math.min(1,dt*30);
  });
  const over=state==='over';
  bodyG.scale.set(1+kickT*0.08,1-kickT*0.1,1+kickT*0.08);
  bodyG.rotation.x=-kickT*0.15+(over?0.25:0);
  bodyG.rotation.z=Math.sin(t*28)*0.18*stumble;
  bodyG.position.y=1.45-(over?0.1:0);
  headG.rotation.x=over?0.7:-clamp((ball.y-2.2)*0.12,-0.1,0.5)+((curSkin==='sad'||curSkin==='l')?0.3:0);
  headG.rotation.y=clamp((ball.x-rooster.position.x)*0.5,-0.5,0.5);
  headG.position.y=0.95+(play?Math.sin(t*12)*0.03:0);
  wings.forEach(function(w){w.g.rotation.z=w.s*((over?0.05:0.15)+kickT*0.9+(play?Math.sin(t*9)*0.06:0));});
  sparkG.rotation.y+=dt*1.6;sparkG.position.y=Math.sin(t*3)*0.08;capeG.rotation.x=0.15+Math.sin(t*5)*0.08+kickT*0.2;
  auraG.rotation.y+=dt*0.8;auraG.scale.setScalar(1+Math.sin(t*4)*0.06);godG.scale.setScalar(1+Math.sin(t*2.5)*0.05);halo.position.y=0.72+Math.sin(t*3)*0.04;
  tailG.rotation.y=Math.sin(t*3)*0.12;tailG.rotation.x=over?0.5:Math.sin(t*2)*0.05;
  rShadow.position.x=rooster.position.x;

  ballMesh.position.set(ball.x,ball.y,BZ);
  ballMesh.rotation.x+=dt*(3+ball.vy*0.2);ballMesh.rotation.z+=ball.vx*dt*1.5;
  const sh=Math.max(0.15,0.5-ball.y*0.05);
  bShadow.position.set(ball.x,0.025,BZ);bShadow.scale.set(sh,sh*0.7,1);bShadow.material.opacity=Math.max(0.1,0.4-ball.y*0.04);

  ringOut.position.set(ball.x,RING_Y,BZ);ringIn.position.set(ball.x,RING_Y,BZ);
  const dy=ball.y-RING_Y,inWin=play&&ball.vy<=0&&dy>=-0.6&&dy<=1.1,inPerf=inWin&&dy>=-0.25&&dy<=0.35;
  const pulse=1+Math.sin(t*10)*0.04;
  ringOut.material.color.setHex(cooldown>0?0xff5555:0x66ff88);
  ringOut.material.opacity=cooldown>0?0.4:(inWin?1:0.5);
  ringOut.scale.setScalar(inWin?pulse*1.08:1);
  ringIn.material.opacity=inPerf?1:0.55;ringIn.scale.setScalar(inPerf?pulse*1.2:1);
  ringOut.visible=ringIn.visible=state!=='over';

  parts.forEach(function(p){
    if(p.life<=0)return;p.life-=dt;
    if(p.life<=0){p.m.visible=false;return;}
    p.vy-=9*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    p.m.material.opacity=clamp(p.life*1.6,0,1);
  });

  const cheer=state==='play'?(0.1+Math.min(hits,40)*0.01+kickT*0.3):0.05;
  crowd.forEach(function(c){c.position.y=c.userData.base+Math.abs(Math.sin(t*4+c.userData.ph))*cheer;});

  const sx=shake>0?(Math.random()-.5)*shake*0.6:0,sy=shake>0?(Math.random()-.5)*shake*0.4:0;
  camera.position.set(ball.x*0.35+sx,3.3+sy,camZ);
  camera.lookAt(ball.x*0.2,2.5,0);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);
}
applySel();
render('menu');
initCloud();
requestAnimationFrame(frame);
})();
</script>
</body>
